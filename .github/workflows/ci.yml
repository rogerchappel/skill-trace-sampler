name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  release-check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      # Keep this separate from release:check so a clean checkout proves the
      # standalone test command builds and discovers the complete suite.
      - run: npm test
      - run: npm run release:check
      - name: Verify release from source export
        if: matrix.node-version == 20
        run: |
          export_root="$(mktemp -d)"
          git archive HEAD | tar -x -C "$export_root"
          cd "$export_root"
          npm install --ignore-scripts
          npm run release:check
